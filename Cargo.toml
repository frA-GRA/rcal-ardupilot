[package]
name = "rcal-sim"
version = "0.1.0"
edition = "2021"
description = "MAVLink-to-UCI gateway for ArduPilot SITL"

[[bin]]
name = "rcal_sim"
path = "src/bin/rcal_sim.rs"

[dependencies]
rcal        = "3"
rcal_macros = "3"
mavlink     = { version = "0.21", default-features = false, features = ["std", "dialect-ardupilotmega", "transport-udp", "transport-tcp"] }
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
chrono      = "0.4"
slog        = "2"
